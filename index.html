<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Laboratorio interactivo de macroeconomía: IS-LM lineal y no lineal, construcción de curvas, políticas fiscal y monetaria, Mundell-Fleming, oferta y demanda agregada, IS-MP con regla de Taylor y comparación de escenarios."
    />
    <meta name="color-scheme" content="dark light" />
    <style>
      html { background: #0f1318; color-scheme: dark; }
      html[data-theme='light'] { background: #f4f4f1; color-scheme: light; }
    </style>
    <script>
      // Apply the theme before the first paint (no flash): dark by default;
      // light only when requested by the link (?theme=light) or chosen earlier.
      (function () {
        var theme = 'dark';
        try {
          var q = new URLSearchParams(window.location.search).get('theme');
          var s = window.localStorage.getItem('islm.theme');
          if (q === 'light' || q === 'dark') theme = q;
          else if (s === 'light' || s === 'dark') theme = s;
        } catch (e) {
          /* storage unavailable: keep dark */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <title>IS-LM | Laboratorio Avanzado de Macroeconomía</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
